name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        if: github.event.action != 'closed'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: bun install --frozen-lockfile

      - name: Build
        # PR previews are served from /pr-preview/pr-<N>/ on the dedicated
        # preview branch (not the custom domain), so set the Vite base path
        # accordingly so assets resolve correctly.
        if: github.event.action != 'closed'
        env:
          GITHUB_PAGES_BASE: /pr-preview/pr-${{ github.event.number }}/
        run: bun run build

      - name: SPA fallback (copy index.html to 404.html)
        if: github.event.action != 'closed'
        run: cp dist/index.html dist/404.html

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          preview-branch: gh-pages-previews
          umbrella-dir: pr-preview
          action: auto
          # Deploy to a SEPARATE repo so production Pages on this repo is
          # untouched. Set PREVIEW_REPO (e.g. "owner/pockethifi-previews")
          # as a repo variable, and PREVIEW_DEPLOY_TOKEN as a secret
          # (fine-grained PAT with Contents: read/write on the preview repo).
          deploy-repository: ${{ vars.PREVIEW_REPO }}
          token: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}